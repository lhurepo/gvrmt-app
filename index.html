<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRVMNT Productions — Dance Scheduling & Attendance</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      #root { width: 100%; height: 100%; }
      .grvmnt-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #1a1416;
        color: #d8aafb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .grvmnt-loading-content { text-align: center; }
      .grvmnt-loading-title {
        font-size: 2.5rem;
        font-weight: bold;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }
      .grvmnt-loading-sub { opacity: 0.6; font-size: 0.875rem; }
      .grvmnt-loading-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #824fb7;
        margin: 0 3px;
        animation: grvmnt-bounce 1.4s infinite ease-in-out both;
      }
      .grvmnt-loading-dot:nth-child(1) { animation-delay: -0.32s; }
      .grvmnt-loading-dot:nth-child(2) { animation-delay: -0.16s; }
      @keyframes grvmnt-bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="grvmnt-loading">
        <div class="grvmnt-loading-content">
          <div class="grvmnt-loading-title">GRVMNT</div>
          <div class="grvmnt-loading-sub" style="margin-bottom: 1rem;">Productions</div>
          <div>
            <span class="grvmnt-loading-dot"></span>
            <span class="grvmnt-loading-dot"></span>
            <span class="grvmnt-loading-dot"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
